name: Update Oil News

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Google News RSS
        run: |
          python3 <<'PY'
          import json
          import urllib.request
          import xml.etree.ElementTree as ET
          from email.utils import parsedate_to_datetime
          from datetime import datetime, timezone
          from urllib.parse import urlencode


          # ==========================================
          # Google News URL
          # ==========================================

          def make_google_news_url(query, hl, gl, ceid):
              params = {
                  "q": query,
                  "hl": hl,
                  "gl": gl,
                  "ceid": ceid
              }

              return (
                  "https://news.google.com/rss/search?"
                  + urlencode(params)
              )


          # ==========================================
          # 🇹🇭 Thai News
          # ==========================================

          TH_FEEDS = [
              make_google_news_url(
                  "ราคาน้ำมัน WTI น้ำมันดิบ OPEC",
                  "th",
                  "TH",
                  "TH:th"
              )
          ]


          # ==========================================
          # 🇺🇸 English News
          # จำกัดแหล่งข่าว 4 สำนัก
          # ==========================================

          EN_FEEDS = [
              make_google_news_url(
                  "site:reuters.com WTI crude oil OPEC",
                  "en-US",
                  "US",
                  "US:en"
              ),

              make_google_news_url(
                  "site:bloomberg.com WTI crude oil OPEC",
                  "en-US",
                  "US",
                  "US:en"
              ),

              make_google_news_url(
                  "site:cnbc.com WTI crude oil OPEC",
                  "en-US",
                  "US",
                  "US:en"
              ),

              make_google_news_url(
                  "site:oilprice.com WTI crude oil OPEC",
                  "en-US",
                  "US",
                  "US:en"
              )
          ]


          # ==========================================
          # อ่าน RSS Feed
          # ==========================================

          def fetch_feed(url):

              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0"
                  }
              )

              with urllib.request.urlopen(
                  req,
                  timeout=30
              ) as response:

                  xml_data = response.read()


              root = ET.fromstring(xml_data)

              articles = []


              for item in root.findall(".//item"):

                  title = item.findtext(
                      "title",
                      ""
                  ).strip()

                  link = item.findtext(
                      "link",
                      ""
                  ).strip()

                  pub_date = item.findtext(
                      "pubDate",
                      ""
                  ).strip()


                  source_element = item.find(
                      "source"
                  )

                  source = ""


                  if source_element is not None:

                      source = (
                          source_element.text or ""
                      ).strip()


                  if not title or not link:
                      continue


                  # แปลงวันที่เป็น ISO
                  try:

                      dt = parsedate_to_datetime(
                          pub_date
                      )

                      if dt.tzinfo is None:

                          dt = dt.replace(
                              tzinfo=timezone.utc
                          )


                      iso_date = (
                          dt.astimezone(
                              timezone.utc
                          ).isoformat()
                      )

                  except Exception:

                      iso_date = pub_date


                  articles.append({

                      "title": title,

                      "link": link,

                      "pubDate": iso_date,

                      "source": source

                  })


              return articles


          # ==========================================
          # รวมหลาย Feed
          # ==========================================

          def fetch_multiple_feeds(
              urls,
              limit=8
          ):

              all_articles = []


              for url in urls:

                  try:

                      articles = fetch_feed(url)

                      all_articles.extend(
                          articles
                      )

                      print(
                          "Feed OK:",
                          url
                      )

                  except Exception as e:

                      print(
                          "Feed FAILED:",
                          url
                      )

                      print(
                          "Error:",
                          e
                      )


              # เรียงข่าวใหม่สุดก่อน
              all_articles.sort(
                  key=lambda x: x["pubDate"],
                  reverse=True
              )


              # กันข่าวซ้ำ
              unique = []

              seen = set()


              for article in all_articles:

                  key = (
                      article["title"]
                      .strip()
                      .lower()
                  )


                  if key in seen:
                      continue


                  seen.add(key)

                  unique.append(
                      article
                  )


              return unique[:limit]


          # ==========================================
          # สร้าง news.json
          # ==========================================

          news = {

              "updatedAt":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "th":
                  fetch_multiple_feeds(
                      TH_FEEDS,
                      limit=8
                  ),

              "en":
                  fetch_multiple_feeds(
                      EN_FEEDS,
                      limit=8
                  )
          }


          # ==========================================
          # เขียนไฟล์
          # ==========================================

          with open(
              "news.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  news,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          print(
              "================================"
          )

          print(
              "NEWS UPDATE COMPLETE"
          )

          print(
              "Thai:",
              len(news["th"])
          )

          print(
              "English:",
              len(news["en"])
          )

          print(
              "================================"
          )

          print(
              json.dumps(
                  news,
                  ensure_ascii=False,
                  indent=2
              )
          )

          PY


      - name: Commit updated news
        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add news.json


          if git diff --cached --quiet; then

            echo "No news changes"

          else

            git commit \
              -m "Update oil news"

            git push

          fi
