name: Update Oil News

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch latest oil news
        env:
          TZ: Asia/Bangkok
        run: |
          python3 <<'PY'
          import json
          import re
          import urllib.request
          import urllib.parse
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone, timedelta
          from email.utils import parsedate_to_datetime

          OUTPUT = "news.json"

          NOW = datetime.now(timezone.utc)
          CUTOFF = NOW - timedelta(days=7)

          # ---------------------------------------------------------
          # GOOGLE NEWS RSS
          # ---------------------------------------------------------

          def google_news_url(query, lang, country):
              params = {
                  "q": query,
                  "hl": lang,
                  "gl": country,
                  "ceid": f"{country}:{lang.split('-')[0]}"
              }

              return (
                  "https://news.google.com/rss/search?"
                  + urllib.parse.urlencode(params)
              )

          # ---------------------------------------------------------
          # THAI NEWS
          # ---------------------------------------------------------

          TH_QUERIES = [
              "WTI น้ำมันดิบ ราคาน้ำมัน when:3d",
              "OPEC OPEC+ น้ำมัน when:3d",
              "ราคาน้ำมันโลก Brent WTI when:3d",
              "EIA สต็อกน้ำมัน สหรัฐ when:3d"
          ]

          # ---------------------------------------------------------
          # ENGLISH NEWS
          # เน้นแหล่งข่าวที่ต้องการ
          # ---------------------------------------------------------

          EN_QUERIES = [
              ("Reuters", "site:reuters.com WTI crude oil OPEC when:3d"),
              ("Bloomberg", "site:bloomberg.com WTI crude oil OPEC when:3d"),
              ("CNBC", "site:cnbc.com WTI crude oil OPEC when:3d"),
              ("OilPrice.com", "site:oilprice.com WTI crude oil OPEC when:3d")
          ]

          # ---------------------------------------------------------
          # DATE
          # ---------------------------------------------------------

          def parse_date(value):
              if not value:
                  return None

              try:
                  dt = parsedate_to_datetime(value)

                  if dt.tzinfo is None:
                      dt = dt.replace(tzinfo=timezone.utc)

                  return dt.astimezone(timezone.utc)

              except Exception:
                  return None

          # ---------------------------------------------------------
          # CLEAN TEXT
          # ---------------------------------------------------------

          def clean_text(text):
              if not text:
                  return ""

              text = re.sub(r"<[^>]+>", "", text)
              text = re.sub(r"\s+", " ", text)

              return text.strip()

          # ---------------------------------------------------------
          # FETCH RSS
          # ---------------------------------------------------------

          def fetch_feed(url, forced_source=None):

              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0"
                  }
              )

              with urllib.request.urlopen(
                  request,
                  timeout=30
              ) as response:

                  xml_data = response.read()

              root = ET.fromstring(xml_data)

              articles = []

              for item in root.findall(".//item"):

                  title = clean_text(
                      item.findtext("title")
                  )

                  link = clean_text(
                      item.findtext("link")
                  )

                  description = clean_text(
                      item.findtext("description")
                  )

                  pub_date_raw = clean_text(
                      item.findtext("pubDate")
                  )

                  dt = parse_date(pub_date_raw)

                  # ถ้าอ่านวันที่ไม่ได้ ให้ทิ้ง
                  if not dt:
                      continue

                  # -------------------------------------------------
                  # SAFETY FILTER
                  # ข่าวเกิน 7 วัน ห้ามเข้า news.json
                  # -------------------------------------------------

                  if dt < CUTOFF:
                      continue

                  source_element = item.find("source")

                  source = ""

                  if source_element is not None:
                      source = clean_text(
                          source_element.text or ""
                      )

                  if forced_source:
                      source = forced_source

                  if not title or not link:
                      continue

                  articles.append({
                      "title": title,
                      "link": link,
                      "description": description,
                      "source": source,
                      "pubDate": dt.isoformat()
                  })

              return articles

          # ---------------------------------------------------------
          # DEDUPE
          # ---------------------------------------------------------

          def dedupe(articles):

              seen = set()
              result = []

              for article in articles:

                  title_key = re.sub(
                      r"[^a-z0-9ก-๙]+",
                      "",
                      article["title"].lower()
                  )

                  if title_key in seen:
                      continue

                  seen.add(title_key)

                  result.append(article)

              return result

          # ---------------------------------------------------------
          # THAI
          # ---------------------------------------------------------

          thai_articles = []

          for query in TH_QUERIES:

              try:

                  url = google_news_url(
                      query,
                      "th",
                      "TH"
                  )

                  print("TH:", query)

                  articles = fetch_feed(url)

                  thai_articles.extend(
                      articles
                  )

              except Exception as e:

                  print(
                      "TH ERROR:",
                      query,
                      str(e)
                  )

          thai_articles = dedupe(
              thai_articles
          )

          thai_articles.sort(
              key=lambda x: x["pubDate"],
              reverse=True
          )

          thai_articles = thai_articles[:8]

          # ---------------------------------------------------------
          # ENGLISH
          # ---------------------------------------------------------

          english_articles = []

          for source_name, query in EN_QUERIES:

              try:

                  url = google_news_url(
                      query,
                      "en-US",
                      "US"
                  )

                  print(
                      "EN:",
                      source_name,
                      query
                  )

                  articles = fetch_feed(
                      url,
                      forced_source=source_name
                  )

                  english_articles.extend(
                      articles
                  )

              except Exception as e:

                  print(
                      "EN ERROR:",
                      source_name,
                      str(e)
                  )

          # จำกัดแต่ละสำนักไม่เกิน 2 ข่าว
source_count = {}
balanced_articles = []

for article in sorted(
    english_articles,
    key=lambda x: x["pubDate"],
    reverse=True
):
    source = article["source"]

    if source_count.get(source, 0) >= 2:
        continue

    source_count[source] = source_count.get(source, 0) + 1
    balanced_articles.append(article)

english_articles = dedupe(balanced_articles)
english_articles.sort(
    key=lambda x: x["pubDate"],
    reverse=True
)
english_articles = english_articles[:8]

          # ---------------------------------------------------------
          # RESULT
          # ---------------------------------------------------------

          data = {
              "updatedAt": NOW.isoformat(),
              "th": thai_articles,
              "en": english_articles
          }

          print(
              "Thai articles:",
              len(thai_articles)
          )

          print(
              "English articles:",
              len(english_articles)
          )

          # ---------------------------------------------------------
          # ถ้าไม่มีข่าวใหม่เลย ให้ workflow fail
          # ป้องกันการเขียนข้อมูลว่างทับของเดิม
          # ---------------------------------------------------------

          if not thai_articles:
              raise RuntimeError(
                  "No fresh Thai oil news found."
              )

          if not english_articles:
              raise RuntimeError(
                  "No fresh English oil news found."
              )

          with open(
              OUTPUT,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  data,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              f"Written {OUTPUT}"
          )

          PY

      - name: Commit news.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add news.json

          if git diff --cached --quiet; then
            echo "No news changes."
          else
            git commit -m "Update oil news"
            git push
          fi
